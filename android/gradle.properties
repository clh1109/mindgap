# JDK 17 的启动器按系统 ANSI 编码（中文 Windows 为 GBK）读取 Gradle 生成的
# worker 类路径参数文件；若守护进程用 UTF-8 写，中文工程路径会被解码成乱码，
# 导致单元测试报 ClassNotFoundException。此处与系统编码对齐（GB18030 兼容 GBK）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GB18030
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 工程位于含中文的路径；Windows 下需显式跳过 AGP 的路径检查
android.overridePathCheck=true
kotlin.code.style=official
